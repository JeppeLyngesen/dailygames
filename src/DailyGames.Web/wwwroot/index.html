<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DailyGames – track your daily puzzles and streaks</title>
    <meta name="description" content="Free tracker for Wordle, Connections, Strands and other daily games. Tick off what you've played and keep your streaks alive." />
    <!-- base href is rewritten by the deploy workflow for GitHub Pages -->
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <!-- GitHub Pages SPA: restore the path that 404.html redirected from -->
    <script>
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location));
    </script>
</head>
<body>
    <div id="app">
        <div class="loading">Loading DailyGames…</div>
    </div>
    <div id="blazor-error-ui">
        Something went wrong. <a href="" class="reload">Reload</a> <a class="dismiss">🗙</a>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
